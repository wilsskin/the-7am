# All personal settings for The 7AM. See BUILD_PLAN.md §3.
brand: { name: "The 7AM" }          # working name, Wilson may rename
recipient: w0skinner@gmail.com
feedback_address: w0skinner+7am-feedback@gmail.com   # Reply-To on every issue (§10b)
sender: "The 7AM <7am@wilsonskinner.com>"     # wilsonskinner.com verified in Resend Nov 27, 2026 (§10); tracking off
timezone: America/New_York
location: { name: "New York", lat: 40.7306, lon: -73.9866 }   # East Village
subway_lines: ["4", "5"]
# Wilson's ride: Fulton St to 14 St-Union Sq on the 4/5 express (GTFS stop ids, decided Nov 25, 2026).
# Alerts that name stations only count if they touch one of these; elsewhere (the Bronx, Brooklyn) is dropped.
subway_stops: { "418": "Fulton St", "640": "Brooklyn Bridge-City Hall", "635": "14 St-Union Sq" }

markets:
  indices:
  # Card order: S&P 500, Nasdaq, Dow (Wilson, Nov 27, 2026)
    - { symbol: "^GSPC", label: "S&P 500" }
    - { symbol: "^IXIC", label: "Nasdaq" }
    - { symbol: "^DJI",  label: "Dow" }
  crypto:
    - { symbol: "BTC-USD", label: "Bitcoin" }
    - { symbol: "ETH-USD", label: "Ether" }
  holdings: ["SOXX", "PLTR", "GOOGL", "GEV", "COST", "V", "GS"]   # card order; SOXX, PLTR, GOOGL, GEV first (Wilson, Nov 27, 2026)
  standout_min_market_cap: 100_000_000_000
  movers_shortlist: 8        # biggest 1-day moves passed to Claude, who writes up 2-3
  big_earnings_universe: top_200_sp500_by_market_cap   # plus holdings. Decided Nov 22, 2026 (was top 50); any top_N works, or all_sp500

sports:
  # week_preview: list this team's games Monday through Sunday in the Monday issue.
  teams:
    - { league: nfl, team: "San Francisco 49ers", week_preview: true }
    - { league: nba, team: "Golden State Warriors", week_preview: true }
    - { league: mlb, team: "San Francisco Giants", week_preview: false }
  also_cover: ["NFL major headlines and trades", "NBA major headlines and trades"]

memes:
  count: 6                 # Claude picks up to this many
  # In order of preference. Any of: shortsqueez, litquidity, lemmy, reddit (needs approved API keys).
  sources: ["shortsqueez", "litquidity", "lemmy"]
  newsletter_max_age_hours: 26   # only issues from the last day, so nothing repeats
  lemmy_candidates: 8      # cap on Lemmy (or Reddit) candidates
  # Lemmy: lemmy.world reads communities on every Lemmy server. Wilson will tune.
  lemmy_instance: lemmy.world
  lemmy_communities: ["memes@lemmy.world", "programmer_humor@programming.dev", "memes@sopuli.xyz",
                      "comicstrips@lemmy.world", "memes@lemmy.ml"]
  min_score: 100           # Lemmy is smaller than Reddit, so the bar is lower
  # Reddit, if API access is ever approved
  subreddits: ["wallstreetbets", "ProgrammerHumor", "memes"]
  reddit_min_score: 500

sources:
  subscribed: ["wsj.com", "nytimes.com"]          # prefer these links
  allowed: ["wsj.com", "nytimes.com", "reuters.com", "apnews.com", "bbc.com", "bbc.co.uk",
            "nbcnews.com", "cnbc.com", "axios.com", "theverge.com", "techcrunch.com",
            "espn.com", "variety.com", "hollywoodreporter.com", "gothamist.com", "ny1.com",
            "ft.com", "bloomberg.com"]
  paywalled_unsubscribed: ["ft.com", "bloomberg.com"]   # link only if no other source has it
  # Allowed only in Off the clock (ski, things to do, outdoors, cars, AI tools). Decided Nov 22, 2026.
  off_the_clock_extra: ["onthesnow.com", "skimag.com", "killington.com", "stowe.com", "palisadestahoe.com",
                        "timeout.com", "theinfatuation.com", "eater.com", "nymag.com", "secretnyc.co",
                        "outsideonline.com", "backpacker.com", "caranddriver.com", "motortrend.com",
                        "electrek.co", "rivian.com", "simonwillison.net"]

# Reminders for Wilson, shown in the footer on the given days before `date` (Wilson, Nov 27, 2026).
# The routine's cron is UTC with no timezone, so it must move an hour on each clock change.
reminders:
  - date: 2027-03-08
    days_before: [14, 7, 3, 2, 1]
    text: "Daylight saving starts Sun, Mar 8. Ask Claude to change the 7AM's schedule to 28 10 * * * (UTC), or issues will arrive an hour late."
  - date: 2027-11-07
    days_before: [14, 7, 3, 2, 1]
    text: "Daylight saving ends Sun, Nov 7. Ask Claude to change the 7AM's schedule back to 28 11 * * * (UTC), or issues will arrive an hour early."
